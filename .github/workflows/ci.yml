name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian_ci
          POSTGRES_DB: meridian
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U meridian" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6390:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Test configuration
        run: |
          cat > apps/api/.env.test <<EOF
          NODE_ENV=test
          PORT=4100
          LOG_LEVEL=silent
          DATABASE_URL=postgresql://meridian:meridian_ci@localhost:5440/meridian?schema=test
          REDIS_URL=redis://localhost:6390/1
          JWT_SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(48).toString('base64url'))")
          ENCRYPTION_KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
          ADMIN_ORIGIN=http://localhost:5180
          PUBLIC_API_URL=http://localhost:4100
          STORAGE_DRIVER=local
          STORAGE_LOCAL_DIR=./storage-test
          WEBHOOK_ALLOW_PRIVATE_URLS=true
          WEBHOOK_BACKOFF_MS=50
          WEBHOOK_MAX_ATTEMPTS=3
          SCHEDULER_INTERVAL_MS=300
          AUTH_RATE_LIMIT_PER_MINUTE=1000
          EOF

      - name: Generate Prisma client
        run: npm run db:generate -w @meridian/api
      - name: Type-check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t meridian-api:${{ github.sha }} .
      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t meridian-admin:${{ github.sha }} .
