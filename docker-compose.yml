# Meridian — local infrastructure and optional full-stack containers.
#
#   docker compose up -d postgres redis          → infra only (default dev flow)
#   docker compose --profile s3 up -d            → + local S3-compatible object store
#   docker compose --profile full up -d --build  → + API and admin containers
#
# Host ports are deliberately non-default so this stack can sit beside other projects.
name: meridian

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-meridian}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6390}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store for local development of the "s3" storage driver.
  # In production point S3_* at Cloudflare R2 / AWS S3 instead of running this.
  s3:
    profiles: ["s3"]
    image: ${S3_IMAGE:-adobe/s3mock:4.11.0}
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-meridian-media}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3data
    ports:
      - "${S3_PORT:-9100}:9090"
    volumes:
      - s3data:/s3data

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD:-meridian_dev_password}@postgres:5432/${POSTGRES_DB:-meridian}?schema=public
      REDIS_URL: redis://redis:6379
      # Both are required: the API validates its environment on boot and refuses to start without them.
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5180}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9090}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-meridian-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-meridian}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-meridian_dev_secret}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - apistorage:/app/apps/api/storage

  admin:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-5180}:80"

volumes:
  pgdata:
  redisdata:
  s3data:
  apistorage:
